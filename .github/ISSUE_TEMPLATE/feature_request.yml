name: Feature Request
description: Suggest an idea or improvement for DVD Subtitle Extractor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! The more detail you provide, the easier it is to weigh up.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or limitation you're running into.
      placeholder: "Describe the situation where the current behaviour falls short..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like DVD Subtitle Extractor to do.
      placeholder: "Describe the behaviour or option you'd like to see..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Application Area
      description: Which part of the application does this relate to?
      options:
        - DVD/Folder Loading (Step 1)
        - Track Selection (Step 2)
        - Extraction/Demuxing (Step 3)
        - Subtitle Selection (Step 4)
        - OCR/Character Recognition (Step 5)
        - Spell Check (Step 6)
        - File Export (Step 7)
        - Word Spacing (Step 8)
        - Settings/Configuration
        - Other
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
      placeholder: "Any workarounds you're using today, or other approaches you weighed..."
    validations:
      required: false
